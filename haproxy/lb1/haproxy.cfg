global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    option httplog

frontend http_front
    bind *:80
    default_backend waf_back

backend waf_back
    balance roundrobin
    # Use TCP check instead of HTTP to prevent WAF from blocking the health check
    option tcp-check
    server waf1 172.20.0.21:8080 check
    server waf2 172.20.0.22:8080 check
