vrrp_script chk_haproxy {
    script "killall -0 haproxy"
    interval 2
    weight 2
}

vrrp_instance VI_1 {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 100
    unicast_src_ip 172.20.0.11
    unicast_peer {
        172.20.0.10
    }
    virtual_ipaddress {
        172.20.0.100/16 dev eth0
    }
    track_script {
        chk_haproxy
    }
}
